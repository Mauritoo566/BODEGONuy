<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodegón · Pinceles de materia</title>
<meta name="description" content="Quince pinceles que convierten el movimiento del cursor en materia: cerámica, piedra, metal, pasta, espuma, arena, espinas y más. Capas, espejos, borrador con volumen y exportación PNG transparente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23c9744c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fbfaf7;
  --panel: #ffffff;
  --ink: #16100e;
  --muted: #6d6660;
  --line: #e6e1d8;
  --accent: #c9744c;
  --accent-ink: #ffffff;
  --stage: #efebe4;
  --paper: #ffffff;
  --chip: #f3f0ea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141211;
    --panel: #1c1a18;
    --ink: #f1ece6;
    --muted: #a39b93;
    --line: #2f2b28;
    --accent: #e08a5f;
    --accent-ink: #141211;
    --stage: #0f0e0d;
    --chip: #26231f;
  }
}
:root[data-theme="dark"] {
  --bg: #141211; --panel: #1c1a18; --ink: #f1ece6; --muted: #a39b93; --line: #2f2b28;
  --accent: #e08a5f; --accent-ink: #141211; --stage: #0f0e0d; --chip: #26231f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  display: flex; flex-direction: column;
}
button, select, input { font: inherit; color: inherit; }
header.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 700; letter-spacing: -.01em; font-size: 15px; margin-right: 8px; white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.btn {
  border: 1px solid var(--line); background: var(--chip); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
label.inline input[type=range] { width: 90px; }
select.btn { padding-right: 6px; }

.app { flex: 1; display: grid; grid-template-columns: 230px 1fr 290px; min-height: 0; }
aside { background: var(--panel); overflow-y: auto; min-height: 0; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
.sec { padding: 14px 14px 16px; border-bottom: 1px solid var(--line); }
.sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

.brushes { display: flex; flex-direction: column; gap: 6px; padding: 10px; }
.brush {
  display: grid; grid-template-columns: 1fr; gap: 4px; text-align: left;
  border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer; background: var(--panel);
}
.brush:hover { border-color: var(--muted); }
.brush.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.brush canvas { width: 100%; height: auto; aspect-ratio: 200 / 72; border-radius: 6px; background: #f6f3ee; display: block; }
.brush .nm { display: flex; gap: 6px; font-weight: 500; }
.brush .nm i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

.stage {
  position: relative; background: var(--stage); overflow: hidden; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
#view {
  background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08);
  touch-action: none; cursor: crosshair; display: block;
}
.hint {
  position: absolute; pointer-events: none; color: #8d857c; font-size: 14px; text-align: center; line-height: 1.6;
}
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 500;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }

.bname { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.bdesc { color: var(--muted); margin: 0 0 12px; }
.ctl { margin-bottom: 12px; }
.ctl .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
.ctl .row output { color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--chip); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.layer {
  display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 4px;
}
.layer.on { border-color: var(--ink); }
.layer .ln { flex: 1; background: none; border: 0; text-align: left; cursor: pointer; padding: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .ln small { color: var(--muted); }
.ib { border: 0; background: none; cursor: pointer; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
.ib:hover { background: var(--chip); color: var(--ink); }
.layer.hidden .ln { opacity: .45; }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .stage { height: 62vh; order: 1; }
  aside.left { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  aside.right { order: 3; border-left: 0; border-top: 1px solid var(--line); }
  .brushes { flex-direction: row; overflow-x: auto; }
  .brush { flex: 0 0 150px; }
  body { height: auto; }
  html, body { height: auto; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Bodegón <span>· Pinceles de materia</span></div>
  <div class="tools">
    <select class="btn" id="tpl" aria-label="Plantillas"><option value="">Plantillas…</option></select>
    <button class="btn" id="upload">Subir imagen</button>
    <button class="btn" id="toggleImg" disabled>Ocultar imagen</button>
    <input type="file" id="file" accept="image/*" hidden>
    <span class="sep"></span>
    <button class="btn" id="mx" title="Repite el trazo en espejo horizontal">Espejo ↔</button>
    <button class="btn" id="my" title="Repite el trazo en espejo vertical">Espejo ↕</button>
    <button class="btn" id="eraser" title="E">Borrador</button>
    <label class="inline">Tamaño <input type="range" id="erSize" min="4" max="160" value="36"></label>
    <span class="sep"></span>
    <button class="btn" id="undo" title="Ctrl+Z">Deshacer</button>
    <button class="btn" id="clear">Limpiar</button>
    <span class="sep"></span>
    <button class="btn" id="hq" title="Renderiza la exportación al doble de resolución">Mejorar calidad</button>
    <button class="btn primary" id="export">Exportar PNG</button>
    <button class="btn" id="exportImg" disabled>PNG con imagen</button>
  </div>
</header>

<div class="app">
  <aside class="left"><div class="brushes" id="brushes"></div></aside>
  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="hint" id="hint">Elige un pincel y dibuja.<br>La velocidad, las pausas y las curvas cambian el grosor y el relieve.</div>
    <div class="toast" id="toast"></div>
  </main>
  <aside class="right">
    <div class="sec" id="panel"></div>
    <div class="sec">
      <h2>Capas</h2>
      <ul class="layers" id="layers"></ul>
    </div>
  </aside>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- noise & random ---------------- */
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const noiseCache = new Map();
function noiseTex(W, H, S) {
  const key = W + 'x' + H + '@' + S;
  if (noiseCache.has(key)) return noiseCache.get(key);
  const n = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const X = x / S, Y = y / S;
    n[y * W + x] = vnoise(X / 18, Y / 18) * 0.5 + vnoise(X / 7, Y / 7) * 0.3 + vnoise(X / 2.5, Y / 2.5) * 0.2;
  }
  noiseCache.set(key, n);
  if (noiseCache.size > 4) noiseCache.delete(noiseCache.keys().next().value);
  return n;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hex(c) {
  const v = parseInt(c.slice(1), 16);
  return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255];
}

/* ---------------- materials ---------------- */
const CERAMIC = 0, MATTE = 1, METAL = 2, STONE = 3, EMBOSS = 4, SAND = 5, FOAM = 6, MOSS = 7, STIPPLE = 8, PEARL = 9, CLAY = 10;
const PALETTES = {
  chrome: ['#15171c', '#8b94a4', '#f6f8fc'],
  gold:   ['#3a2205', '#b98a2c', '#fff0b5'],
  steel:  ['#1e242b', '#6c7985', '#dde5ec'],
};
const DOME = 0, CONE = 1, SOFT = 2;
const MAX = 0, ADD = 1, SUB = 2;

function pickMat(sel, P) {
  if (PALETTES[sel]) return { kind: METAL, pal: PALETTES[sel].map(hex) };
  if (sel === 'ceramic') return { kind: CERAMIC };
  if (sel === 'leaf') return { kind: MOSS, leaf: true };
  return { kind: MATTE, gloss: .2 };
}

/* ---------------- brush helpers ---------------- */
const matOpts = [['steel', 'Acero'], ['chrome', 'Cromo'], ['gold', 'Oro'], ['ceramic', 'Cerámica'], ['matte', 'Mate'], ['leaf', 'Hoja']];
const R = (k, l, min, max, step, unit) => ({ k, l, t: 'range', min, max, step, unit });
const C = (k, l) => ({ k, l, t: 'color' });
const O = (k, l, opts) => ({ k, l, t: 'select', opts });
const shadowCtl = R('shadow', 'Sombra entre capas', 0, 1, .01);

function rope(ctx, a, b, spacingK, fn) {
  ctx.walk(a, b, s => Math.max(0.7 * ctx.S, ctx.w(s) * spacingK), fn);
}
function spike(ctx, x, y, dx, dy, L, r0, bendX, bendY, prof, exp) {
  const n = Math.max(4, Math.ceil(L / Math.max(0.6 * ctx.S, r0 * 0.3)));
  for (let j = 0; j <= n; j++) {
    const u = j / n;
    const px = x + dx * L * u + bendX * L * u * u, py = y + dy * L * u + bendY * L * u * u;
    const r = r0 * Math.pow(1 - u, exp || 1) + 0.45 * ctx.S;
    ctx.dome(px, py, r, r * 1.05, prof, MAX);
  }
}

/* ---------------- the fifteen brushes ---------------- */
const BRUSHES = [
  {
    id: 'ceramic', name: 'Cerámica esmaltada',
    desc: 'Cuerdas de porcelana con brillo de laca. Los extremos terminan en gota o en cuña.',
    d: { width: 28, speed: .6, relief: 1, light: 135, color: '#1d4ed8', ends: 'drop', shadow: .6 },
    ctl: [C('color', 'Color'), O('ends', 'Extremos', [['drop', 'Gota'], ['wedge', 'Cuña']]), shadowCtl],
    layered: () => true, needsFinal: () => true,
    mat: () => ({ kind: CERAMIC }),
    seg(ctx, a, b) {
      const P = ctx.P;
      rope(ctx, a, b, .12, (x, y, s, tx, ty, len) => {
        let r = ctx.w(s) / 2;
        if (P.ends === 'wedge') {
          const tl = r * 5;
          let f = Math.min(1, len / tl);
          if (ctx.total != null) f = Math.min(f, (ctx.total - len) / tl);
          r *= Math.pow(Math.max(f, .04), .8);
        }
        ctx.dome(x, y, r, r, DOME, MAX);
        if (P.ends === 'drop' && len === 0) ctx.dome(x, y, r * 1.3, r * 1.3, DOME, MAX);
        ctx.last = { x, y, s };
      });
    },
    end(ctx) {
      if (ctx.P.ends === 'drop' && ctx.last) { const r = ctx.w(ctx.last.s) / 2 * 1.3; ctx.dome(ctx.last.x, ctx.last.y, r, r, DOME, MAX); }
    },
  },
  {
    id: 'stone', name: 'Pincel de piedra',
    desc: 'Las líneas se funden en una sola roca y la ladera iluminada se cubre de grano.',
    d: { width: 42, speed: .5, relief: .9, light: 135, color: '#8a8177', grain: .6, rough: .8 },
    ctl: [C('color', 'Color'), R('grain', 'Grano', 0, 1, .01), R('rough', 'Rugosidad', 0, 1.5, .01)],
    layered: () => false, mat: () => ({ kind: STONE }), rough: P => P.rough,
    seg(ctx, a, b) { rope(ctx, a, b, .15, (x, y, s) => { const r = ctx.w(s) / 2; ctx.dome(x, y, r, r * .75, DOME, MAX); }); },
  },
  {
    id: 'metal', name: 'Metal cinético',
    desc: 'Metal pulido con paleta ajustable de sombra, medio tono y brillo.',
    d: { width: 30, speed: .7, relief: 1.1, light: 135, c1: '#0b1020', c2: '#7d8aa6', c3: '#f5f7ff', mode: 'merged', shadow: .4 },
    ctl: [C('c1', 'Sombra'), C('c2', 'Medio tono'), C('c3', 'Brillo'), O('mode', 'Trazos', [['merged', 'Fundidos'], ['layered', 'En capas']]), shadowCtl],
    layered: P => P.mode === 'layered',
    mat: P => ({ kind: METAL, pal: [hex(P.c1), hex(P.c2), hex(P.c3)] }),
    seg(ctx, a, b) { rope(ctx, a, b, .06, (x, y, s) => { const r = ctx.w(s) / 2; ctx.dome(x, y, r, r, DOME, MAX); }); },
  },
  {
    id: 'emboss', name: 'Estampado en relieve',
    desc: 'La forma se presiona desde una hoja: canto redondeado o afilado.',
    d: { width: 34, speed: .4, relief: .8, light: 135, color: '#e9e4da', edge: 'round', sheet: 'off', grain: .3 },
    ctl: [C('color', 'Color de la hoja'), O('edge', 'Canto', [['round', 'Redondeado'], ['sharp', 'Afilado']]), O('sheet', 'Hoja', [['off', 'Solo forma'], ['on', 'Visible (tapa lo de abajo)']]), R('grain', 'Grano del papel', 0, 1, .01)],
    layered: () => false, mat: P => ({ kind: EMBOSS, sheetParam: P.sheet === 'on' }),
    seg(ctx, a, b) {
      const prof = ctx.P.edge === 'sharp' ? CONE : DOME;
      rope(ctx, a, b, .12, (x, y, s) => { const r = ctx.w(s) / 2; ctx.dome(x, y, r, r * .55, prof, MAX); });
    },
  },
  {
    id: 'paste', name: 'Pasta volumétrica',
    desc: 'Las cuerdas se apilan unas sobre otras o se funden en una sola masa espesa.',
    d: { width: 30, speed: .6, relief: 1, light: 135, color: '#e85d2a', mode: 'layered', shadow: .7 },
    ctl: [C('color', 'Color'), O('mode', 'Trazos', [['layered', 'Apilados'], ['merged', 'Fundidos']]), shadowCtl],
    layered: P => P.mode === 'layered', mat: () => ({ kind: MATTE, gloss: .35 }),
    seg(ctx, a, b) { rope(ctx, a, b, .12, (x, y, s) => { const r = ctx.w(s) / 2; ctx.dome(x, y, r, r * .9, DOME, MAX); }); },
    dwell(ctx, p) { const r = ctx.w(0) / 2 * 1.15; ctx.dome(p.x, p.y, r, r * .9, DOME, MAX); },
  },
  {
    id: 'foam', name: 'Pincel de espuma',
    desc: 'Rápido: una franja lisa. Lento: la línea engorda y hierve en burbujas.',
    d: { width: 34, speed: .8, relief: .8, light: 135, color: '#f1eee8', bubbles: .8 },
    ctl: [C('color', 'Color'), R('bubbles', 'Burbujas', 0, 1, .01)],
    layered: () => false, mat: () => ({ kind: FOAM }),
    bubble(ctx, x, y, r, sl) {
      const n = 1 + Math.floor(ctx.rng() * 2 * sl + .5);
      for (let k = 0; k < n; k++) {
        const ang = ctx.rng() * Math.PI * 2, dist = r * (.2 + .9 * ctx.rng()) * (1 + sl * .6);
        const br = r * (.15 + .4 * ctx.rng()) * (.6 + sl);
        ctx.dome(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, br, br, DOME, MAX);
      }
    },
    seg(ctx, a, b) {
      rope(ctx, a, b, .14, (x, y, s) => {
        const r = ctx.w(s) / 2;
        ctx.dome(x, y, r, r * .45, SOFT, MAX);
        const sl = clamp((.45 - s) / .45, 0, 1) * ctx.P.bubbles;
        if (ctx.rng() < sl * .9) this.bubble(ctx, x, y, r, sl);
      });
    },
    dwell(ctx, p) { if (ctx.rng() < ctx.P.bubbles) this.bubble(ctx, p.x, p.y, ctx.w(0) / 2, ctx.P.bubbles * 1.2); },
  },
  {
    id: 'foam3d', name: 'Espuma volumétrica',
    desc: 'Cuerdas de espuma en capas que proyectan sombra unas sobre otras.',
    d: { width: 36, speed: .5, relief: .9, light: 135, color: '#f4f1ec', shadow: .9, bubbles: .6 },
    ctl: [C('color', 'Color'), R('bubbles', 'Textura de burbuja', 0, 1, .01), shadowCtl],
    layered: () => true, mat: () => ({ kind: FOAM }),
    seg(ctx, a, b) {
      rope(ctx, a, b, .12, (x, y, s, tx, ty) => {
        const r = ctx.w(s) / 2;
        ctx.dome(x, y, r, r * .95, DOME, MAX);
        if (ctx.rng() < .5 * ctx.P.bubbles) {
          const o = (ctx.rng() - .5) * r * 1.3, br = r * (.15 + .22 * ctx.rng());
          ctx.dome(x - ty * o, y + tx * o, br, r * .75 + br * .6, DOME, MAX);
        }
      });
    },
    dwell(ctx, p) { const r = ctx.w(0) / 2; ctx.dome(p.x + (ctx.rng() - .5) * r, p.y + (ctx.rng() - .5) * r, r * .5, r * 1.1, DOME, MAX); },
  },
  {
    id: 'beads', name: 'Cuentas metálicas',
    desc: 'Cuentas ensartadas a lo largo de la línea: cromo, oro, acero, perla o plástico.',
    d: { width: 22, speed: .5, relief: 1, light: 135, bead: 'chrome', color: '#e11d48', gap: .05 },
    ctl: [O('bead', 'Material', [['chrome', 'Cromo'], ['gold', 'Oro'], ['steel', 'Acero'], ['pearl', 'Perla'], ['plastic', 'Plástico']]), C('color', 'Color (plástico)'), R('gap', 'Separación', 0, 1, .01)],
    layered: () => false,
    mat: P => P.bead === 'pearl' ? { kind: PEARL, c: hex('#f1e9dd') } : P.bead === 'plastic' ? { kind: CERAMIC } : { kind: METAL, pal: PALETTES[P.bead].map(hex) },
    seg(ctx, a, b) {
      ctx.walk(a, b, s => Math.max(ctx.S, ctx.w(s) * (1 + ctx.P.gap)), (x, y, s) => { const r = ctx.w(s) / 2; ctx.dome(x, y, r * .98, r, DOME, MAX); });
    },
  },
  {
    id: 'sand', name: 'Pincel de arena',
    desc: 'Los granos se agrupan en una gota a ritmo lento y se dispersan a ritmo rápido.',
    d: { width: 30, speed: .9, relief: 1, light: 135, color: '#d8b27a', density: .6, grainSize: 1 },
    ctl: [C('color', 'Color'), R('density', 'Densidad', .05, 1, .01), R('grainSize', 'Tamaño del grano', .4, 3, .05)],
    layered: () => false, mat: () => ({ kind: SAND }),
    grains(ctx, x, y, spread, n) {
      for (let k = 0; k < n; k++) {
        const gx = x + (ctx.rng() + ctx.rng() + ctx.rng() - 1.5) / 1.5 * spread;
        const gy = y + (ctx.rng() + ctx.rng() + ctx.rng() - 1.5) / 1.5 * spread;
        const gr = ctx.S * (.7 + ctx.rng() * 1.3) * ctx.P.grainSize;
        ctx.dome(gx, gy, gr, gr, DOME, MAX);
      }
    },
    seg(ctx, a, b) {

    { brush: 'beads', P: { bead: 'gold', width: 16 }, strokes: [{ pts: path(400, u => [W * (.2 + .6 * u), H * (.22 + .36 * (1 - (2 * u - 1) ** 2))]) }] }] },
  { name: 'Pasta en capas', make: (W, H) => [{ brush: 'paste', P: {}, strokes: [0, 1, 2, 3, 4].map(k => ({ pts: path(300, u => [W * (.1 + .8 * u), H * (.24 + .13 * k) + H * .06 * Math.sin(u * Math.PI * 4 + k * 1.3)], u => .3 + .3 * Math.sin(u * 9 + k)) })) }] },
  { name: 'Roca', make: (W, H, m) => [{ brush: 'stone', P: { width: 60 }, strokes: [{ pts: path(700, u => { const t = u * Math.PI * 10, r = m * (.12 + .1 * Math.sin(u * 37)); return [W / 2 + Math.cos(t) * r + m * .1 * Math.sin(u * 11), H / 2 + Math.sin(t) * r * .8]; }) }] }] },
  { name: 'Relieve sobre hoja', make: (W, H) => [{ brush: 'emboss', P: { sheet: 'on' }, strokes: [{ pts: path(500, u => [W / 2 + W * .3 * Math.sin(u * Math.PI * 2), H / 2 + H * .26 * Math.sin(u * Math.PI * 4 + .5)]) }] }] },
  { name: 'Espuma hirviendo', make: (W, H) => [{ brush: 'foam', P: {}, strokes: [{ pts: path(300, u => [W * (.15 + .7 * u), H / 2 + H * .15 * Math.sin(u * Math.PI * 3)], u => .5 - .45 * Math.sin(u * Math.PI)) }] }] },
  { name: 'Musgo poroso', make: (W, H, m) => [{ brush: 'porous', P: { width: 70 }, strokes: [{ pts: path(600, u => { const t = u * Math.PI * 7, r = m * (.08 + .16 * u); return [W / 2 + Math.cos(t) * r, H / 2 + Math.sin(t) * r * .75]; }) }] }] },
  { name: 'Metal líquido', make: (W, H, m) => [{ brush: 'metal', P: {}, strokes: [{ pts: path(700, u => { const t = u * Math.PI * 2, r = m * .34 * (.55 + .45 * Math.cos(3 * t)); return [W / 2 + Math.cos(t) * r, H / 2 + Math.sin(t) * r]; }, u => .2 + .6 * Math.abs(Math.sin(u * Math.PI * 3))) }] }] },
  { name: 'Arena en ritmo', make: (W, H) => [{ brush: 'sand', P: {}, strokes: [{ pts: path(500, u => [W * (.1 + .8 * u), H / 2 + H * .2 * Math.sin(u * Math.PI * 2)], u => .5 + .5 * Math.sin(u * Math.PI * 6)) }] }] },
];
(function initTemplates() {
  const sel = $('#tpl');
  TEMPLATES.forEach((t, i) => { const o = document.createElement('option'); o.value = i; o.textContent = t.name; sel.appendChild(o); });
  sel.onchange = () => {
    const t = TEMPLATES[sel.value]; sel.value = '';
    if (!t) return;
    if (state.layers.some(L => L.strokes.length) && !confirm('La plantilla reemplaza el dibujo actual. ¿Continuar?')) return;
    const W = state.W, H = state.H, m = Math.min(W, H);
    state.layers = []; state.active = null; state.history = [];
    let last = null;
    for (const spec of t.make(W, H, m)) {
      const L = newLayerObj(spec.brush, Object.assign({}, BR[spec.brush].d, spec.P));
      L.strokes = spec.strokes.map(s => ({ pts: s.pts, erase: false, mirror: { x: !!(s.mirror && s.mirror.x), y: !!(s.mirror && s.mirror.y) }, seed: (Math.random() * 2 ** 31) | 0 }));
      state.layers.push(L);
      rebuild(L); last = L;
    }
    setActive(last);
    toast('Plantilla: ' + t.name + ' · ajusta los controles');
  };
})();

/* ---------------- keyboard & init ---------------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'e' || e.key === 'E') setEraser(!state.eraser);
  else if ((e.key === '[' || e.key === ']') && state.active) {
    const P = state.active.P; P.width = clamp(P.width + (e.key === ']' ? 2 : -2), 4, 120);
    renderPanel(); scheduleRebuild();
  }
});
window.addEventListener('resize', fit);
initBrushList();
addLayer('ceramic');
compose(); fit();
</script>
